; PlatformIO build for the LilyGoLib factory firmware, compiled from this
; repository's own sources (src/ = LilyGoLib 0.3.0, examples/factory = app).
;
; Target: LilyGO T-Watch S3 Plus (ESP32-S3, 16MB flash, 8MB OPI PSRAM, SX1262)
;
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = twatchs3
src_dir = examples/factory
boards_dir = ./boards

; The repository root is also the LilyGoLib library (lib_deps = symlink://.).
; PlatformIO decides which library owns a header by checking whether the
; header lives inside that library's folder, so any downloaded library kept
; under <repo>/.pio/libdeps would be claimed by LilyGoLib itself and LilyGoLib
; would never receive its include path ("lvgl.h: No such file or directory").
; Keeping downloaded libraries outside the repository avoids this.
libdeps_dir = ../.pio-libdeps/Watch-S3-Plus

[env_arduino]
framework = arduino
platform = espressif32@8.0.0
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions = examples/factory/partitions.csv
lib_ldf_mode = deep
build_flags =
    -D CORE_DEBUG_LEVEL=0

    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
    -Wnarrowing

    -D ARDUINO_LILYGO_LORA_SX1262   ; Used SX1262 LoRa

monitor_filters =
    default
    esp32_exception_decoder

; Versions follow docs/third_party.md (T-Watch-S3 section) for LilyGoLib 0.3.0.
lib_deps =
    symlink://.
    lvgl/lvgl @ 9.6.0
    jgromes/RadioLib @ 7.7.1
    lewisxhe/SensorLib @ 0.5.0
    earlephilhower/ESP8266Audio @ 2.4.1
    h2zero/NimBLE-Arduino @ 2.5.1
    tanakamasayuki/PCMFlow @ 0.2.1
    tanakamasayuki/PCMFlowG722 @ 0.2.0

[env:twatchs3]
extends = env_arduino
board = lilygo-t-watch-s3
build_flags =
    ${env_arduino.build_flags}
    -D ARDUINO_T_WATCH_S3
    -I variants/lilygo_twatch_s3
lib_deps =
    ${env_arduino.lib_deps}
    adafruit/Adafruit INA219 @ 1.2.3
    adafruit/Adafruit BusIO @ 1.17.4
    https://github.com/tonhuisman/IRremoteESP8266/archive/refs/heads/feature/C++20-compatibility.zip
; Pulled in by Adafruit INA219's manifest for its examples only; not used on the watch.
lib_ignore =
    Adafruit NeoPixel
    Adafruit GFX Library
    Adafruit SSD1306
